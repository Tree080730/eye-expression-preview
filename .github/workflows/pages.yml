name: Publish expression and companion previews

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble both previews
        run: |
          mkdir -p _site/walking-companion
          cp -R expression-preview/. _site/
          cp -R walking-companion/index.html walking-companion/css walking-companion/js walking-companion/assets walking-companion/workbench _site/walking-companion/
      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Confirm Pages artifact is readable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['GH_RUN_ID']}/artifacts"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          for attempt in range(12):
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response).get("artifacts", [])
              if any(a["name"] == "github-pages" and not a["expired"] for a in artifacts):
                  print("Pages artifact is available to the deployment token.")
                  break
              print(f"Waiting for artifact metadata ({attempt + 1}/12).")
              time.sleep(5)
          else:
              raise SystemExit("Uploaded Pages artifact is not visible to the deployment token.")
          PYTHON
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
