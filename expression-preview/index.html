  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f3eb;
    color: #19241e;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  main { width: min(100% - 40px, 800px); margin: 0 auto; padding: 38px 0; }

  canvas { display: block; width: 100%; height: auto; background: #32ce60; border-radius: 12px; }
  .controls { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  button {
    min-height: 44px;
    min-width: 86px;
    border: 1px solid #19241e;
    border-radius: 7px;
    background: #19241e;
    color: #fff;
    font: inherit;
    font-weight: 600;

  button:disabled { opacity: 0.55; cursor: wait; }
  .export { margin-top: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .export span { font-size: 13px; color: #45564d; }
  .expressions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .expressions button { min-width: 0; padding: 0 14px; background: transparent; color: #19241e; border-color: #b9c4b8; }
  .expressions button:hover { background: #e2eadf; }
  .expressions button[aria-pressed="true"] { background: #19241e; color: #fff; border-color: #19241e; }
  :focus-visible { outline: 2px solid #087833; outline-offset: 4px; }
  input { flex: 1; min-width: 0; margin: 0; height: 32px; accent-color: #247740; cursor: pointer; }
  output { font: 13px ui-monospace, monospace; min-width: 8.5ch; text-align: right; color: #45564d; }
  @media (max-width: 480px) {
    main { width: calc(100% - 28px); padding: 24px 0; }

<script>
// Playback clock from grok-bot-study dfe1140, web/bot-element.jsx.
class MotionClock {
  constructor(onFrame) {
    this.elapsed = 0;
    this.origin = performance.now();
    this.running = false;
    this.pending = null;
    this.frame = null;
    this.painted = false;
    this.onFrame = onFrame;
  }
  now() { return this.elapsed + (this.running ? performance.now() - this.origin : 0); }
  setRunning(value) {
    if (value === this.running) return;
    this.elapsed = this.now();
    this.origin = performance.now();
    this.running = value;
    cancelAnimationFrame(this.frame);
    this.frame = null;
    if (value && this.pending) this.schedule();
  }
  schedule() {
    if (this.frame !== null || !this.pending) return;
    this.frame = requestAnimationFrame(() => {
      this.frame = null;
      const callback = this.pending;
      this.pending = null;
      this.painted = true;
      const time = this.now();
      if (this.running) this.onFrame?.(time);
      callback?.(time);
    });
  }
  requestFrame(callback) {
    this.pending = callback;
    if (this.running || !this.painted) this.schedule();
    return this.frame;
  }
  cancelFrame() {
    cancelAnimationFrame(this.frame);
    this.frame = null;
    this.pending = null;
  }
}

// Spring integration and gaze damping from grok-bot-study dfe1140, web/motion-engine.js.
const stepSeconds = 1 / 120;
const gazeFrequency = 13;
const gazeDamping = 1;

function stepSpring(spring, target, frequency, damping = gazeDamping) {
  const acceleration = -2 * damping * frequency * spring.velocity
    - frequency ** 2 * (spring.position - target);
  spring.velocity += acceleration * stepSeconds;
  spring.position += spring.velocity * stepSeconds;
  if (!Number.isFinite(spring.position) || !Number.isFinite(spring.velocity)) {
    spring.position = target;
    spring.velocity = 0;
  }
}

// The source steers the lid spring through closure, reopening and settling.
const blinkLidTargets = [
  { at: 0, openness: 0.05 },
  { at: 150, openness: 1.08 },
  { at: 300, openness: 1 },
];
const lidFrequency = 26;

const restingMotion = { stretch: 1, pinch: 0, lift: 0, tilt: 0, shapeMix: 0 };

function buildClip({ duration, gaze, blinks, blinkRate = 1, motion, motionFrequency = 10 }) {
  const lids = [{ at: 0, openness: 1 }, ...blinks.flatMap(start =>
    blinkLidTargets.map(({ at, openness }) => ({ at: start + at * blinkRate, openness })))];
  const x = { position: gaze[0].x, velocity: 0 };
  const y = { position: gaze[0].y, velocity: 0 };
  const lid = { position: 1, velocity: 0 };
  const motionSprings = Object.entries(restingMotion).map(([channel, position]) =>
    ({ channel, position, velocity: 0 }));
  const motionTargets = [restingMotion, ...motion];
  const restingFrame = { x: x.position, y: y.position, openness: 1, ...restingMotion, shapeVelocity: 0 };
  const frames = [restingFrame];
  let keyframe = 0;
  let lidKeyframe = 0;
  let motionKeyframe = 0;

  for (let index = 1; index < Math.ceil(duration / (stepSeconds * 1000)); index++) {
    const time = index * stepSeconds * 1000;
    while (gaze[keyframe + 1]?.at <= time) keyframe++;
    while (lids[lidKeyframe + 1]?.at <= time) lidKeyframe++;
    while (motionTargets[motionKeyframe + 1]?.at <= time) motionKeyframe++;
    stepSpring(x, gaze[keyframe].x, gazeFrequency);
    stepSpring(y, gaze[keyframe].y, gazeFrequency);
    stepSpring(lid, lids[lidKeyframe].openness, lidFrequency);
    const frame = { x: x.position, y: y.position, openness: Math.min(1, lid.position) };
    for (const spring of motionSprings) {
      const { channel } = spring;
      const damping = channel === 'shapeMix' ? 0.48 : gazeDamping;
      stepSpring(spring, motionTargets[motionKeyframe][channel] ?? restingMotion[channel], motionFrequency, damping);
      frame[channel] = spring.position;
      if (channel === 'shapeMix') frame.shapeVelocity = spring.velocity;
    }
    frames.push(frame);
  }
  frames.push(restingFrame);
  return { duration, frames };
}

const canvas = document.querySelector('#face');
const context = canvas.getContext('2d');
const defaultEyes = [
  { shape: new Path2D(), centerX: 257.55, pupilX: 308.7, pupilY: 288.9 },
  { shape: new Path2D(), centerX: 537.1, pupilX: 600.3, pupilY: 306.2 },
];
defaultEyes[0].shape.rect(107.7, 175.9, 299.7, 161.5);
defaultEyes[1].shape.arc(537.1, 256.45, 143.85, 0, 2 * Math.PI);

function buildReferenceEye({ rect, circle, cutout, pupil }) {
  const shape = new Path2D();
  if (rect) shape.rect(...rect);
  else shape.arc(...circle, 0, 2 * Math.PI);
  let mask;
  if (cutout) {
    mask = new Path2D();
    mask.rect(-800, -800, 2400, 2400);
    mask.moveTo(cutout[0] + cutout[2], cutout[1]);
    mask.arc(...cutout, 0, 2 * Math.PI);
  }
  const [pupilX, pupilY, pupilRadius] = pupil;
  return { shape, mask, pupilX, pupilY, pupilRadius };
}

function buildEyeMasks({ top = -100, slope = 0 }) {
  return defaultEyes.map(({ centerX }, index) => {
    const angle = index === 0 ? slope : -slope;
    const left = centerX - 160;
    const right = centerX + 160;
    const mask = new Path2D();
    mask.moveTo(left, top - 160 * angle);
    mask.lineTo(right, top + 160 * angle);
    mask.lineTo(right, 700);
    mask.lineTo(left, 700);
    mask.closePath();
    return mask;
  });
}

function morphEyeShapes(amount, velocity = 0) {
  const mix = Math.max(0, Math.min(1, amount));
  return defaultEyes.map((eye, index) => {
    const roundness = index === 0 ? mix : 1 - mix;
    const width = 299.7 + (287.7 - 299.7) * roundness;
    const height = 161.5 + (287.7 - 161.5) * roundness;
    const direction = index === 0 ? 1 : -1;
    const squash = Math.tanh(velocity / 8) * 0.14 * direction;
    const shape = new Path2D();
    // Morph each eye around its own fixed center, with symmetric squash and stretch.
    for (let point = 0; point <= 128; point++) {
      const angle = point / 128 * Math.PI * 2;
      const cosine = Math.cos(angle);
      const sine = Math.sin(angle);
      const exponent = 2 / Math.max(roundness, 0.005);
      const radius = roundness === 0
        ? 1 / Math.max(Math.abs(cosine), Math.abs(sine))
        : Math.pow(Math.abs(cosine) ** exponent + Math.abs(sine) ** exponent, -1 / exponent);
      const x = eye.centerX + width / 2 * cosine * radius * (1 + squash);
      const y = 256.5 + height / 2 * sine * radius / (1 + squash);
      if (point === 0) shape.moveTo(x, y);
      else shape.lineTo(x, y);
    }
    shape.closePath();
    return { ...eye, shape };
  });
}

function drawFace({ x, y, openness, eyeX, eyeY, stretch, pinch, lift, tilt, shapeMix, shapeVelocity }) {
  const frameEyes = shapeMix !== 0 || shapeVelocity !== 0
    ? morphEyeShapes(shapeMix, shapeVelocity)
    : eyes;
  context.fillStyle = '#32ce60';
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.save();
  const eyeCenterX = canvas.width / 2;
  const eyeCenterY = pose.blinkCenterY ?? 256.5;
  context.translate(eyeCenterX + eyeX, eyeCenterY + eyeY - lift);
  context.rotate(tilt);
  context.scale(1, openness * stretch * (pose.height ?? 1));
  context.translate(-eyeCenterX, -eyeCenterY);
  context.fillStyle = '#fff';
  frameEyes.forEach((eye, index) => {
    context.save();
    context.translate(index === 0 ? pinch : -pinch, 0);
    const mask = eye.mask ?? eyeMasks?.[index];
    if (mask) context.clip(mask, 'evenodd');
    context.fill(eye.shape);
    context.restore();
  });
  frameEyes.forEach((eye, index) => {
    context.save();
    context.translate(index === 0 ? pinch : -pinch, 0);
    context.clip(eye.shape);
    const mask = eye.mask ?? eyeMasks?.[index];
    if (mask) context.clip(mask, 'evenodd');
    context.fillStyle = '#000';
    context.beginPath();
    const inward = (pose.pupilInward ?? 0) * (index === 0 ? 1 : -1);
    const radius = eye.pupilRadius ?? pose.pupilRadius ?? 80.85;
    context.arc(eye.pupilX + x + inward, eye.pupilY + y, radius, 0, 2 * Math.PI);
    context.fill();
    context.restore();
  });
  context.restore();
}

function measureCenterOffset(restingFrame) {
  drawFace({ ...restingFrame, eyeX: 0, eyeY: 0 });
  const { width, height } = canvas;
  const image = context.getImageData(0, 0, width, height);
  const pixels = new Uint32Array(image.data.buffer);
  const background = pixels[0];
  let left = width;
  let right = -1;
  let top = height;
  let bottom = -1;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      if (pixels[y * width + x] === background) continue;
      left = Math.min(left, x);
      right = Math.max(right, x);
      top = Math.min(top, y);
      bottom = y;
    }
  }
  return {
    x: (width - left - right - 1) / 2,
    y: (height - top - bottom - 1) / 2,
  };
}

const timeline = document.querySelector('#timeline');
const play = document.querySelector('#play');
const timeLabel = document.querySelector('#time');
const expressionControls = document.querySelector('#expressions');
let clip;
let pose;
let eyes;
let eyeMasks;
let centerOffset;
const centerOffsets = new WeakMap();
const clock = new MotionClock();
let position = 0;
let playbackStart = 0;
let wasPlaying = false;
let expressionFrame;
let selectedExpression;
let exporting = false;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let pointer = null;
let followFrame = null;
const gazeOffset = { x: 0, y: 0, weight: 0 };
const pupilCenterOffset = { x: 48, y: 36 };
const eyeFollowAmount = 0.35;

function drawCurrentFace() {
  // As in the reference, manual gaze softens the scripted eye movement.
  const expressionWeight = 1 - 0.8 * gazeOffset.weight;
  // Move the two eye shapes together using the directional part of the gaze.
  const eyeX = (gazeOffset.x + pupilCenterOffset.x * gazeOffset.weight) * eyeFollowAmount;
  const eyeY = (gazeOffset.y + pupilCenterOffset.y * gazeOffset.weight) * eyeFollowAmount;
  const referenceWeight = pose.eyes ? gazeOffset.weight : 0;
  drawFace({
    ...expressionFrame,
    x: expressionFrame.x * expressionWeight + gazeOffset.x + pupilCenterOffset.x * referenceWeight,
    y: expressionFrame.y * expressionWeight + gazeOffset.y + pupilCenterOffset.y * referenceWeight,
    eyeX: centerOffset.x + eyeX,
    eyeY: centerOffset.y + eyeY + (pose.eyeBounce ?? 0) * (expressionFrame.y - clip.frames[0].y),
  });
}

function updateFollow(now) {
  const elapsed = Math.min(50, now - followFrameTime);
  followFrameTime = now;
  // Match the source's normalized pointer coordinates and time-based easing.
  const blend = 1 - Math.pow(0.84, elapsed * 60 / 1000);
  const target = pointer ?? { x: 0, y: 0, weight: 0 };
  for (const axis of ['x', 'y', 'weight']) {
    const difference = target[axis] - gazeOffset[axis];
    gazeOffset[axis] = Math.abs(difference) < 0.01
      ? target[axis]
      : gazeOffset[axis] + difference * blend;
  }
  if (!clock.running) drawCurrentFace();
  followFrame = gazeOffset.x === target.x && gazeOffset.y === target.y && gazeOffset.weight === target.weight
    ? null
    : requestAnimationFrame(updateFollow);
}

let followFrameTime = 0;
function scheduleFollow() {
  if (followFrame !== null) return;
  followFrameTime = performance.now();
  followFrame = requestAnimationFrame(updateFollow);
}

function clearPointer() {
  if (!pointer) return;
  pointer = null;
  scheduleFollow();
}

canvas.addEventListener('pointermove', event => {
  if (exporting || event.pointerType === 'touch' || reducedMotion.matches) return;
  const rect = canvas.getBoundingClientRect();
  const normalized = ratio => Math.max(-0.6, Math.min(0.6, ratio - 0.5));
  pointer = {
    x: 22 * normalized((event.clientX - rect.left) / rect.width) * 7.5 - pupilCenterOffset.x,
    y: 14 * normalized((event.clientY - rect.top) / rect.height) * 7.5 - pupilCenterOffset.y,
    weight: 1,
  };
  scheduleFollow();
});
canvas.addEventListener('pointerleave', clearPointer);
canvas.addEventListener('pointercancel', clearPointer);
window.addEventListener('blur', clearPointer);
reducedMotion.addEventListener('change', clearPointer);

function show(time) {
  position = Math.min(clip.duration, time);
  const frameIndex = position === clip.duration
    ? clip.frames.length - 1
    : Math.round(position / (stepSeconds * 1000));
  expressionFrame = clip.frames[frameIndex];
  drawCurrentFace();
  timeline.value = Math.round(position);
  const seconds = (position / 1000).toFixed(2) + ' s';
  timeLabel.textContent = seconds;
  timeline.setAttribute('aria-valuetext', seconds);
}

function pause() {
  clock.setRunning(false);
  clock.cancelFrame();
  play.textContent = position >= clip.duration ? '重播' : position > 0 ? '继续' : '播放';
}

function animate(now) {
  show(now - playbackStart);
  if (position >= clip.duration) {
    pause();
    return;
  }
  clock.requestFrame(animate);
}

function resume() {
  if (position >= clip.duration) show(0);
  playbackStart = clock.now() - position;
  clock.setRunning(true);
  play.textContent = '暂停';
  clock.requestFrame(animate);
}

const expressionButtons = Object.values(expressions).map(expression => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = expression.label;
  button.addEventListener('click', () => selectExpression(expression));
  expressionControls.append(button);
  return button;
});

function selectExpression(expression) {
  selectedExpression = expression;
  clip = buildClip(expression);
  pose = expression.pose ?? {};
  eyes = pose.eyes?.map(buildReferenceEye) ?? defaultEyes;
  eyeMasks = pose.top === undefined ? null : buildEyeMasks(pose);
  centerOffset = centerOffsets.get(expression);
  if (!centerOffset) {
    centerOffset = measureCenterOffset(clip.frames[0]);
    centerOffsets.set(expression, centerOffset);
  }
  timeline.max = clip.duration;
  canvas.setAttribute('aria-label', expression.label);
  for (const button of expressionButtons) {
    button.setAttribute('aria-pressed', String(button.textContent === expression.label));
  }
  show(0);
  pause();
}

play.addEventListener('click', () => {
  if (clock.running) pause();
  else resume();
});

timeline.addEventListener('input', () => {
  show(Number(timeline.value));
  pause();
});

const exportButton = document.querySelector('#export-gif');
const exportStatus = document.querySelector('#export-status');
exportButton.addEventListener('click', async () => {
  if (exporting) return;
  const savedPosition = position;
  const wasRunning = clock.running;
  const controls = [...document.querySelectorAll('button, input')];
  const palette = [[50, 206, 96], [255, 255, 255], [0, 0, 0]];
  // Keep the same palette throughout the animation, including antialiased edges.
  for (const [from, to] of [[palette[0], palette[1]], [palette[0], palette[2]], [palette[1], palette[2]]]) {
    for (let step = 1; step < 16; step++) {
      palette.push(from.map((value, index) => Math.round(value + (to[index] - value) * step / 16)));
    }
  }
  pause();
  exporting = true;
  pointer = null;
  cancelAnimationFrame(followFrame);
  followFrame = null;
  Object.assign(gazeOffset, { x: 0, y: 0, weight: 0 });
  controls.forEach(control => { control.disabled = true; });
  try {
    const encoder = window.gifenc.GIFEncoder();
    const delay = 50;
    const frameCount = Math.ceil(clip.duration / delay);
    for (let frame = 0; frame < frameCount; frame++) {
      show(frame * delay);
      const { data } = context.getImageData(0, 0, canvas.width, canvas.height);
      const indexed = window.gifenc.applyPalette(data, palette);
      encoder.writeFrame(indexed, canvas.width, canvas.height, {
        palette: frame === 0 ? palette : undefined,
        delay: Math.min(delay, clip.duration - frame * delay),
        repeat: 0,
      });
      if (frame % 4 === 0) {
        exportStatus.textContent = '正在导出 ' + Math.round((frame + 1) / frameCount * 100) + '%';
        await new Promise(resolve => setTimeout(resolve, 0));
      }
    }
    encoder.finish();
    const blob = new Blob([encoder.bytes()], { type: 'image/gif' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = selectedExpression.label + '-844x580.gif';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    exportStatus.textContent = '已导出「' + selectedExpression.label + '」 · ' + (blob.size / 1024 / 1024).toFixed(2) + ' MB';
  } catch (error) {
    console.error(error);
    exportStatus.textContent = '导出失败，请重试。' + (error.message ?? '');
  } finally {
    exporting = false;
    controls.forEach(control => { control.disabled = false; });
    show(savedPosition);
    if (wasRunning) resume();
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearPointer();
    wasPlaying = clock.running;
    if (wasPlaying) pause();
  } else if (wasPlaying) {
    wasPlaying = false;
    resume();
  }
});

selectExpression(expressions.confused);
</script>
</body>
